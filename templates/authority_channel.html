{% extends 'base.html' %}{% block title %}Canal Autoridades{% endblock %}{% block content %}<div class="heading"><div><span class="eyebrow">CANAL AUTORIDADES</span><h1>Coordinación interna.</h1><p>Los casos aquí son internos a la plataforma y se auditan cuando corresponde.</p></div></div><div class="card"><small>COMANDOS</small><div class="command"><input id="command" placeholder="/help"><button class="btn light" onclick="runCmd()">Ejecutar</button></div><pre id="out"></pre></div><div class="card"><small>SOLICITAR REFUERZO INTERNO</small><form id="refForm" class="grid2"><label>Área<input name="target_authority_type" required></label><label>Prioridad<select name="priority"><option>normal</option><option>high</option></select></label><label>Motivo<input name="reason" required></label><label class="gridfull">Descripción<textarea name="description" required></textarea></label><button class="btn dark gridfull">Registrar</button></form></div>{% endblock %}{% block scripts %}<script>async function runCmd(){let d=await FA.api('/api/commands',{method:'POST',body:JSON.stringify({command:document.getElementById('command').value,context:'authority'})});document.getElementById('out').textContent=d.commands?d.commands.map(x=>x.name+'\n'+x.description+'\n'+x.syntax).join('\n\n'):d.message}document.getElementById('refForm').addEventListener('submit',async e=>{e.preventDefault();let d=await FA.api('/api/authority/reinforcement',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});FA.toast(d.message,d.ok?'ok':'err')})</script>{% endblock %}
