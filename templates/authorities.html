{% extends 'base.html' %}{% block title %}Autoridades{% endblock %}{% block content %}<div class="page-head"><div><span class="eyebrow">VERIFICACIÓN</span><h1>Solicitar verificación institucional.</h1><p>Ser verificado significa estar verificado dentro de FerreñafeX, no implica integración oficial.</p></div></div><div class="card"><form id="authorityForm" class="grid2" enctype="multipart/form-data"><label>Institución<input name="institution" required></label><label>Tipo<select name="authority_type"><option>Policía</option><option>Bomberos</option><option>Salud</option><option>Gestión del Riesgo</option><option>Servicios Públicos</option><option>Medio Ambiente</option></select></label><label>Cargo<input name="position" required></label><label>Área<input name="area"></label><label>Código institucional<input name="institutional_code"></label><label>Correo institucional<input name="institutional_email"></label><label class="gridfull">Motivo<textarea name="reason" rows="5" required></textarea></label><label class="gridfull">Documento o evidencia<input type="file" name="document" accept="application/pdf,image/png,image/jpeg,image/webp"></label><button class="btn light gridfull">Enviar solicitud</button></form></div>{% endblock %}{% block scripts %}<script>document.getElementById('authorityForm').addEventListener('submit',async e=>{e.preventDefault();let d=await FA.upload('/api/authority/request',new FormData(e.target));FA.toast(d.message,d.ok?'ok':'err');if(d.ok)e.target.reset()})</script>{% endblock %}
