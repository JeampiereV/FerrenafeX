{% extends 'base.html' %}{% block title %}Soporte{% endblock %}{% block content %}<div class="heading"><div><span class="eyebrow">CENTRO DE SOPORTE</span><h1>Abre un ticket y dale contexto al problema.</h1></div></div><div class="split"><div class="card"><form id="ticketForm" class="grid2"><label>Asunto<input name="subject" required></label><label>Categoría<select name="category"><option>Soporte técnico</option><option>Cuenta</option><option>Moderación</option><option>Privacidad</option><option>Autoridades</option><option>Otro</option></select></label><label>Prioridad<select name="priority"><option>normal</option><option>high</option></select></label><label class="gridfull">Mensaje<textarea name="message" rows="7" required></textarea></label><button class="btn light gridfull">Crear ticket</button></form></div><div id="tickets" class="list"></div></div>{% endblock %}{% block scripts %}<script>window.CURRENT_USER_ID={{nav_user.id}};</script><script src="/static/js/tickets.js"></script>{% endblock %}
