{% extends 'base.html' %}{% block title %}Nuevo reporte{% endblock %}{% block content %}<div class="page-head"><div><span class="eyebrow">REPORTES</span><h1>Cuenta qué está pasando.</h1><p>Describe hechos verificables. No realices acusaciones sin sustento.</p></div><a class="btn ghost" href="/reports">Volver</a></div><div class="card formcard"><form id="reportForm" class="grid2" enctype="multipart/form-data"><label>Categoría<select name="category"><option>Seguridad</option><option>Salud</option><option>Inundaciones</option><option>Agua</option><option>Saneamiento</option><option>Medio ambiente</option><option>Residuos</option><option>Infraestructura</option><option>Alumbrado</option><option>Vías</option><option>Animales</option><option>Vivienda</option><option>Otro</option></select></label><label>Prioridad<select name="priority"><option>normal</option><option>high</option></select></label><label>Subcategoría<input name="subcategory"></label><label class="gridfull">Descripción<textarea name="description" rows="7" required></textarea></label><label class="gridfull">Evidencia opcional<input name="evidence" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="gridfull inline"><button type="button" class="btn dark" id="locBtn">Usar mi ubicación</button><span id="locStatus">Sin ubicación</span></div><button class="btn light gridfull">Enviar reporte</button></form></div>{% endblock %}{% block scripts %}<script src="/static/js/reports.js"></script>{% endblock %}
