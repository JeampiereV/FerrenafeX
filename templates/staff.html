{% extends 'base.html' %}{% block title %}Staff{% endblock %}{% block content %}<div class="heading"><div><span class="eyebrow">STAFF</span><h1>Moderación con evidencia.</h1><p>Las denuncias no suspenden automáticamente a nadie.</p></div></div><div id="cases" class="list"></div>{% endblock %}{% block scripts %}<script>async function load(){let d=await FA.api('/api/moderation');if(!d.ok)return FA.toast(d.message,'err');document.getElementById('cases').innerHTML=d.cases.map(c=>`<div class="row"><div><b>#${c.id} · ${FA.escape(c.reason)}</b><span>${FA.escape(c.target_type)} · ${c.status}</span></div><button class="btn dark" onclick="resolve(${c.id})">Cerrar</button></div>`).join('')}async function resolve(id){let d=await FA.api('/api/moderation/'+id,{method:'POST',body:JSON.stringify({status:'closed',resolution:'Revisión Staff'})});FA.toast(d.ok?'Caso cerrado.':d.message,d.ok?'ok':'err');load()}load()</script>{% endblock %}
